server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: micro-report-engine
  datasource:
    url: jdbc:h2:mem:report_meta_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

report:
  security:
    aes-secret-key: "MascomReportEngineSecureSecretKey2026!#" # 32 bytes AES-256 Key
    jwt-secret: "MASCOM_DYNAMIC_REPORT_SUPER_SECRET_JWT_SIGNING_KEY_2026_VERY_SECURE"
    allow-anonymous: false
  export:
    storage-dir: "./temp_exports"
    max-rows: 100000
    streaming-window-size: 500
    file-expiry-hours: 24
  housekeeping:
    cron-temp-cleanup: "0 0 1 * * *" # 01:00 AM daily
    cron-template-freeze: "0 0 2 * * *" # 02:00 AM daily
    template-freeze-days: 90
